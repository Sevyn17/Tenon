# 终端 ybase 的内置 profile（plugin-switch-plan §2.1 / §3.1）。
# 插件开关按各插件声明的缺省（Meta.Default）；这里只写强制插件。
# 叠加顺序：内置 < ~/.ybase/profile.toml < <dir>/.ybase/profile.toml（项目受信时）< -profile。
# 开关示例：
#   [[plugin]]
#   name = "web"
#   enabled = true
# 内核参数写在 [kernel] 节（键见 kernel/docs/03 - 约束清单.md）。

mandatory = ["store-sqlite"]
