name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go（gofmt / 文件名 / 文档链接 / vet / test / race）
    runs-on: ubuntu-latest
    env:
      # 模块代理：GitHub 托管 runner 直连 proxy.golang.org 即可；自建 runner（如 NAS 上的
      # Gitea act_runner，容器里访问不了 Google）需要国内镜像。这里列多个，Go 按顺序回退。
      # GOFLAGS 关掉 toolchain 自动下载：go.mod 的 go 版本由 setup-go 装好，避免容器里再拉。
      GOPROXY: https://goproxy.cn,https://goproxy.io,https://proxy.golang.org,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      # Go 工具链：自建 runner 从 github.com 下 go-*.tar.gz 常超时（ETIMEDOUT 20.205.243.166，
      # 上一次成功也花了 9.5 分钟）。所以先用 runner 上已装的 Go；没有才回退到 setup-go 下载。
      - name: 检查 runner 上已有的 Go
        id: localgo
        run: |
          if command -v go >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            go version
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "runner 上没有 go，将回退到 setup-go 下载"
          fi

      - uses: actions/setup-go@v5
        if: steps.localgo.outputs.found != 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 校验 Go 版本
        run: |
          want=$(sed -n 's/^go \([0-9.]*\).*/\1/p' go.mod)
          have=$(go env GOVERSION | sed 's/^go//')
          echo "go.mod 需要 >= $want，实际 $have"
          # 只比较主次版本（如 1.26 vs 1.26.10）。
          lowest=$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -1)
          if [ "$lowest" != "$want" ]; then
            echo "::error::Go 版本过低：需要 >= $want，实际 $have"
            exit 1
          fi

      - name: gofmt
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then echo "未 gofmt："; echo "$bad"; exit 1; fi

      - name: 文件名（Go 模块 zip 只收字母、数字与 ASCII 标点）
        run: |
          badpaths=$(git ls-files -z | perl -CS -0ne 'chomp; for $c (split //) { if (ord($c) < 128) { next if $c =~ m{[A-Za-z0-9!#$%&()+,\-.=@\[\]^_{}~ /]} } else { next if $c =~ /\p{L}/ } print "  $_\n"; last }')
          if [ -n "$badpaths" ]; then echo "文件名含 go 模块不接受的字符："; echo "$badpaths"; exit 1; fi

      - name: 文档链接
        run: python3 scripts/doclinks.py

      - name: go vet
        run: go vet ./...

      # 失败时把失败包逐个 -v 重跑；用 ::error:: 把失败行写进 check-run 注解（无需登录即可从 API 读）。
      - name: go test
        run: |
          set -o pipefail
          if go test -count=1 ./... 2>&1 | tee /tmp/test.log; then
            exit 0
          fi
          echo "=== 失败摘要 ==="
          grep -E '^(FAIL|--- FAIL|panic)|\.go:[0-9]+:' /tmp/test.log | head -80 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "=== 失败包逐个 -v 重跑 ==="
          grep -oP '^FAIL\s+\K\S+' /tmp/test.log | sort -u | while read -r pkg; do
            echo "===== $pkg"
            go test -count=1 -v "$pkg" 2>&1 | grep -E '^(=== RUN|--- FAIL|FAIL|panic)|\.go:[0-9]+:' | tail -40 | while IFS= read -r line; do
              echo "::error::$pkg :: $line"
            done
          done
          exit 1

      - name: go test -race
        run: |
          go test -race -count=1 \
            ./runtime/host/ ./runtime/store/... ./runtime/session/ ./runtime/toolhub/ \
            ./runtime/agent/ ./runtime/bus/ ./runtime/inject/ \
            ./modules/security/... ./modules/collab/... ./modules/extend/... \
            ./runtime/extproc/ ./runtime/component/ ./runtime/callctx/ \
            ./tenontest/ ./apphost/ ./transport/...

  web:
    name: 前端（typecheck / test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: test
        run: pnpm test
