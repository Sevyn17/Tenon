name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go（gofmt / 文件名 / 文档链接 / vet / test / race）
    runs-on: ubuntu-latest
    env:
      # 模块代理：GitHub 托管 runner 直连 proxy.golang.org 即可；自建 runner（如 NAS 上的
      # Gitea act_runner，容器里访问不了 Google）需要国内镜像。这里列多个，Go 按顺序回退。
      # GOFLAGS 关掉 toolchain 自动下载：go.mod 的 go 版本由 setup-go 装好，避免容器里再拉。
      #
      # 自建 runner 的容器每次是新的，模块缓存默认不保留 → 每次都要全量下载，镜像一抖就
      # 整 job 失败（goproxy.cn 的 unexpected EOF / PROTOCOL_ERROR）。所以：
      #   · GOMODCACHE 指到 $HOME 下的固定路径（act_runner 保留宿主 $HOME，跨 job 复用）
      #   · 下载失败重试 3 次（网络抖动通常一次重试就过）
      GOPROXY: https://goproxy.cn,https://goproxy.io,https://proxy.golang.org,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4

      # Go 工具链：自建 runner（act_runner）从 github.com 下 go-*.tar.gz 常超时
      # （ETIMEDOUT / TLS EOF），而且 act_runner 对 steps.<id>.outputs 的 if 条件支持不稳，
      # 所以不用 action 的条件跳过，改成一个 shell 步骤自己判断：
      #   有本地 Go 且版本够 → 直接用；否则才下载官方 tarball（走国内镜像优先）。
      - name: 准备 Go 工具链
        run: |
          set -euo pipefail
          want=$(sed -n 's/^go \([0-9.]*\).*/\1/p' go.mod)
          echo "go.mod 要求 >= $want"

          ver_ok() { # $1 = 版本号（如 1.26.10），与 $want 比主次版本
            local have=$1
            [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -1)" = "$want" ]
          }

          if command -v go >/dev/null 2>&1; then
            have=$(go env GOVERSION | sed 's/^go//')
            if ver_ok "$have"; then
              echo "用 runner 上已有的 Go $have"
              go version
              exit 0
            fi
            echo "runner 上的 Go $have 低于 $want，需要下载"
          else
            echo "runner 上没有 go，需要下载"
          fi

          # 下载官方 tarball：国内镜像优先，失败回退 go.dev。
          arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64|arm64) arch=arm64;; esac
          # go.mod 里的 go 版本可能已带补丁号（1.26.0）也可能不带（1.26）；官方文件名要求完整三段。
          case "$want" in
            *.*.*) full="$want" ;;
            *.*)   full="$want.0" ;;
            *)     full="$want.0.0" ;;
          esac
          echo "下载 Go $full"
          for base in https://golang.google.cn/dl https://go.dev/dl https://mirrors.aliyun.com/golang; do
            url="$base/go${full}.linux-${arch}.tar.gz"
            echo "尝试 $url"
            if curl -fsSL --retry 2 --connect-timeout 20 "$url" -o /tmp/go.tgz; then
              # 容器里常以 root 跑且没有 sudo，先试 sudo、没有再直接解压。
              if command -v sudo >/dev/null 2>&1; then
                sudo tar -C /usr/local -xzf /tmp/go.tgz
              else
                tar -C /usr/local -xzf /tmp/go.tgz
              fi
              echo "/usr/local/go/bin" >> "$GITHUB_PATH"
              export PATH="/usr/local/go/bin:$PATH"
              go version
              exit 0
            fi
          done
          echo "::error::无法获取 Go $want（本地版本不够，镜像与官方都失败）"
          exit 1

      - name: gofmt
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then echo "未 gofmt："; echo "$bad"; exit 1; fi

      - name: 文件名（Go 模块 zip 只收字母、数字与 ASCII 标点）
        run: |
          badpaths=$(git ls-files -z | perl -CS -0ne 'chomp; for $c (split //) { if (ord($c) < 128) { next if $c =~ m{[A-Za-z0-9!#$%&()+,\-.=@\[\]^_{}~ /]} } else { next if $c =~ /\p{L}/ } print "  $_\n"; last }')
          if [ -n "$badpaths" ]; then echo "文件名含 go 模块不接受的字符："; echo "$badpaths"; exit 1; fi

      - name: 文档链接
        run: python3 scripts/doclinks.py

      # 先单独下载依赖并重试：镜像抖动时（unexpected EOF / PROTOCOL_ERROR）重试一次通常就过，
      # 不重试的话整个 job 会因为拉依赖失败而红，掩盖真正的代码问题。
      - name: 下载依赖（带重试）
        run: |
          for i in 1 2 3; do
            if go mod download all; then
              echo "依赖下载完成"
              exit 0
            fi
            echo "第 $i 次下载失败，等 10s 重试"
            sleep 10
          done
          echo "::error::依赖下载三次都失败（镜像网络问题，非代码问题）"
          exit 1

      - name: go vet
        run: go vet ./...

      # 失败时把失败包逐个 -v 重跑；用 ::error:: 把失败行写进 check-run 注解（无需登录即可从 API 读）。
      - name: go test
        run: |
          set -o pipefail
          if go test -count=1 ./... 2>&1 | tee /tmp/test.log; then
            exit 0
          fi
          echo "=== 失败摘要 ==="
          grep -E '^(FAIL|--- FAIL|panic)|\.go:[0-9]+:' /tmp/test.log | head -80 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "=== 失败包逐个 -v 重跑 ==="
          grep -oP '^FAIL\s+\K\S+' /tmp/test.log | sort -u | while read -r pkg; do
            echo "===== $pkg"
            go test -count=1 -v "$pkg" 2>&1 | grep -E '^(=== RUN|--- FAIL|FAIL|panic)|\.go:[0-9]+:' | tail -40 | while IFS= read -r line; do
              echo "::error::$pkg :: $line"
            done
          done
          exit 1

      - name: go test -race
        run: |
          go test -race -count=1 \
            ./runtime/host/ ./runtime/store/... ./runtime/session/ ./runtime/toolhub/ \
            ./runtime/agent/ ./runtime/bus/ ./runtime/inject/ \
            ./modules/security/... ./modules/collab/... ./modules/extend/... \
            ./runtime/extproc/ ./runtime/component/ ./runtime/callctx/ \
            ./tenontest/ ./apphost/ ./transport/...

  web:
    name: 前端（typecheck / test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: test
        run: pnpm test
